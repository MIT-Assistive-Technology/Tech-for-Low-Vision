<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Slicer</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">

    <!-- Local Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-gray-100 text-gray-800 font-inter">

<div class="container mx-auto p-4 md:p-8 max-w-4xl">

<header class="text-center mb-8">
    <h1 class="text-4xl font-bold text-gray-900">3D Model Slicer</h1>
    <p class="text-lg text-gray-600 mt-2">Generate a 2D slice of your 3D model.</p>
</header>

<main class="bg-white p-6 rounded-lg shadow-md">

<form id="slicer-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    <!-- Model File -->
    <div class="col-span-3">
        <label for="file" class="block text-sm font-medium text-gray-700">Model File</label>
        <input type="text" id="file" name="file" value="mug.glb"
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2">
    </div>

    <!-- Pose -->
    <div>
        <h3 class="text-md font-medium mb-2">Camera Position (Pose)</h3>
        <label class="block">Pose X<input id="poseX" name="poseX" type="number" value="0" step="0.1"
            class="w-full p-2 rounded-md border"></label>
        <label class="block">Pose Y<input id="poseY" name="poseY" type="number" value="5" step="0.1"
            class="w-full p-2 rounded-md border"></label>
        <label class="block">Pose Z<input id="poseZ" name="poseZ" type="number" value="0" step="0.1"
            class="w-full p-2 rounded-md border"></label>
    </div>

    <!-- Direction -->
    <div>
        <h3 class="text-md font-medium mb-2">Camera Direction (Dir)</h3>
        <label class="block">Dir X<input id="dirX" name="dirX" type="number" value="0" step="0.1"
            class="w-full p-2 rounded-md border"></label>
        <label class="block">Dir Y<input id="dirY" name="dirY" type="number" value="-1" step="0.1"
            class="w-full p-2 rounded-md border"></label>
        <label class="block">Dir Z<input id="dirZ" name="dirZ" type="number" value="0" step="0.1"
            class="w-full p-2 rounded-md border"></label>
    </div>

    <!-- Slice Parameters -->
    <div>
        <h3 class="text-md font-medium mb-2">Slicing Parameters</h3>
        <label class="block">Total Slices<input id="n" name="n" type="number" value="100"
            class="w-full p-2 rounded-md border"></label>
        <label class="block mt-2">Slice Index<input id="i" name="i" type="number" value="50"
            class="w-full p-2 rounded-md border"></label>
    </div>

    <div class="col-span-3 text-center mt-4">
        <button type="submit"
                class="bg-indigo-600 text-white px-8 py-2 rounded-md shadow hover:bg-indigo-700">
            Generate Slice
        </button>
    </div>

</form>

<!-- Result Section -->
<div id="result-container" class="mt-8 pt-6 border-t text-center">

    <h2 class="text-2xl font-bold">Result</h2>

    <!-- Progress bar -->
    <div id="progress-wrapper" class="w-full max-w-md mx-auto mt-4 hidden">
        <div class="w-full bg-gray-300 rounded-full h-3 overflow-hidden">
            <div id="progress-bar" class="bg-indigo-600 h-3 w-0"></div>
        </div>
        <p class="text-sm text-gray-600 mt-2">Generating slice…</p>
    </div>

    <!-- Loading spinner (backup) -->
    <div id="loader"
         class="hidden animate-spin h-12 w-12 border-b-2 border-indigo-600 mx-auto mt-4"></div>

    <!-- Image -->
    <div id="image-display"
         class="w-64 h-64 mx-auto bg-gray-200 rounded-md flex items-center justify-center
                mt-4 cursor-pointer">
        <p id="placeholder-text" class="text-gray-500">
            Your generated slice will appear here.
        </p>
        <img id="result-image" class="hidden max-w-full max-h-full rounded-md" />
    </div>

    <!-- Centered fullscreen button -->
    <button id="fullscreenBtn"
        aria-label="Open slice in fullscreen view"
        class="mt-4 mx-auto block bg-indigo-600 text-white px-6 py-2 rounded shadow
               hover:bg-indigo-700 hidden">
        Full Screen View
    </button>


    <p id="error-message" class="text-red-500 mt-4 text-sm"></p>
</div>

<!-- Settings Button -->
<button id="openSettings"
        class="fixed bottom-4 right-4 bg-indigo-600 text-white px-4 py-2 rounded-full
               shadow-xl hover:bg-indigo-700">
    Settings
</button>

<!-- Settings Modal -->
<div id="settingsModal"
     class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-96 shadow-2xl">
        <h2 class="text-xl font-bold mb-4">Slice Parameters</h2>

        <form id="settingsForm">
            <label class="block mb-1">Slice Index:</label>
            <input id="modal-i" type="number"
                   class="w-full p-2 border rounded mb-4">

            <label class="block mb-1">Total Slices:</label>
            <input id="modal-n" type="number"
                   class="w-full p-2 border rounded mb-4">

            <button type="submit"
                    class="w-full bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700">
                Apply
            </button>
        </form>

        <button id="closeSettings"
                class="mt-4 w-full bg-gray-300 p-2 rounded hover:bg-gray-400">
            Close
        </button>
    </div>
</div>

<!-- Fullscreen Viewer -->
<div id="viewerOverlay"
     class="hidden fixed inset-0 bg-black flex items-center justify-center"
     role="dialog"
     aria-modal="true"
     aria-labelledby="sliceLabel">

    <!-- Accessible dynamically-updated announcer -->
    <div id="sliceAnnouncer"
         class="sr-only"
         aria-live="polite">
        Slice 0 of 0
    </div>

    <!-- Visible label -->
    <div id="sliceLabel"
         class="absolute top-6 left-6 text-white text-xl font-bold opacity-90"
         aria-hidden="true">
        Slice 0 / 0
    </div>

    <img id="viewerImage"
         class="object-contain w-screen h-screen"
         alt="Slice image" />

    <button id="closeViewer"
            class="absolute top-6 right-6 text-white text-3xl font-bold"
            aria-label="Close fullscreen viewer">
        ✕
    </button>
</div>


</main>
</div>

<!-- JS -->
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
