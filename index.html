<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Slicer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4 md:p-8 max-w-4xl">

        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">3D Model Slicer</h1>
            <p class="text-lg text-gray-600 mt-2">Enter the parameters below to generate a 2D slice of a 3D model.</p>
        </header>

        <main class="bg-white p-6 rounded-lg shadow-md">
            <form id="slicer-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                <!-- Model File -->
                <div class="col-span-1 md:col-span-2 lg:col-span-3">
                    <label for="file" class="block text-sm font-medium text-gray-700">Model File</label>
                    <input type="text" id="file" name="file" value="mug.glb" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                    <p class="mt-1 text-xs text-gray-500">Must be a file located in the `/models` directory.</p>
                </div>

                <!-- Camera Position -->
                <div>
                    <h3 class="text-md font-medium text-gray-800 mb-2">Camera Position (Pose)</h3>
                    <div class="space-y-2">
                        <div>
                            <label for="poseX" class="block text-sm font-medium text-gray-700">Pose X</label>
                            <input type="number" id="poseX" name="poseX" value="0" step="0.1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                        <div>
                            <label for="poseY" class="block text-sm font-medium text-gray-700">Pose Y</label>
                            <input type="number" id="poseY" name="poseY" value="5" step="0.1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                        <div>
                            <label for="poseZ" class="block text-sm font-medium text-gray-700">Pose Z</label>
                            <input type="number" id="poseZ" name="poseZ" value="0" step="0.1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                    </div>
                </div>

                <!-- Camera Direction -->
                <div>
                    <h3 class="text-md font-medium text-gray-800 mb-2">Camera Direction (Dir)</h3>
                    <div class="space-y-2">
                         <div>
                            <label for="dirX" class="block text-sm font-medium text-gray-700">Dir X</label>
                            <input type="number" id="dirX" name="dirX" value="0" step="0.1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                        <div>
                            <label for="dirY" class="block text-sm font-medium text-gray-700">Dir Y</label>
                            <input type="number" id="dirY" name="dirY" value="-1" step="0.1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                        <div>
                            <label for="dirZ" class="block text-sm font-medium text-gray-700">Dir Z</label>
                            <input type="number" id="dirZ" name="dirZ" value="0" step="0.1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                    </div>
                </div>

                <!-- Slicing Parameters -->
                <div>
                    <h3 class="text-md font-medium text-gray-800 mb-2">Slicing Parameters</h3>
                     <div class="space-y-2">
                        <div>
                            <label for="n" class="block text-sm font-medium text-gray-700">Total Slices (n)</label>
                            <input type="number" id="n" name="n" value="100" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                        <div>
                            <label for="i" class="block text-sm font-medium text-gray-700">Slice Index (i)</label>
                            <input type="number" id="i" name="i" value="50" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2">
                        </div>
                    </div>
                </div>

                <!-- Submission Button -->
                <div class="col-span-1 md:col-span-2 lg:col-span-3 text-center mt-4">
                    <button type="submit" class="w-full md:w-auto inline-flex justify-center rounded-md border border-transparent bg-indigo-600 py-2 px-8 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                        Generate Slice
                    </button>
                </div>
            </form>

            <!-- Result Display -->
            <div id="result-container" class="mt-8 pt-6 border-t border-gray-200 text-center">
                <h2 class="text-2xl font-bold text-gray-900 mb-4">Result</h2>
                <div id="loader" class="hidden animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                <div id="image-display" class="w-64 h-64 mx-auto bg-gray-200 rounded-md flex items-center justify-center">
                    <p id="placeholder-text" class="text-gray-500">Your generated slice will appear here.</p>
                    <img id="result-image" src="" alt="Generated Slice" class="hidden max-w-full max-h-full rounded-md">
                </div>
                 <p id="error-message" class="text-red-500 mt-4 text-sm"></p>
            </div>
        </main>

    </div>

    <script>
        const form = document.getElementById('slicer-form');
        const loader = document.getElementById('loader');
        const imageDisplay = document.getElementById('image-display');
        const resultImage = document.getElementById('result-image');
        const placeholderText = document.getElementById('placeholder-text');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            // Clear previous results and show loader
            loader.classList.remove('hidden');
            resultImage.classList.add('hidden');
            placeholderText.classList.remove('hidden');
            errorMessage.textContent = '';

            const formData = new FormData(form);
            const params = new URLSearchParams(formData);
            const requestUrl = `/api/slice?${params.toString()}`;

            try {
                const response = await fetch(requestUrl);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Something went wrong on the server.');
                }

                // Set the image source and show it
                resultImage.src = data.url;
                resultImage.classList.remove('hidden');
                placeholderText.classList.add('hidden');

            } catch (error) {
                console.error('Fetch error:', error);
                errorMessage.textContent = `Error: ${error.message}`;
            } finally {
                // Hide loader
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
